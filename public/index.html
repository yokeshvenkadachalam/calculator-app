
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="calculator">
        <header class="header">
            <div>
                <h1>Calculator</h1>
                <p>Simple. Smart. Powerful.</p>
            </div>
            <div class="icon">✳</div>
        </header>

        <section class="display-container">
            <div id="expression" class="expression"></div>
            <input
                id="display"
                class="display"
                type="text"
                value="0"
                aria-label="Calculator display"
                readonly
            >
        </section>

        <section class="buttons" aria-label="Calculator buttons">

            <button class="utility" data-action="clear">AC</button>
            <button class="utility" data-action="delete">DEL</button>
            <button class="utility" data-action="percent">%</button>
            <button class="operator" data-value="/">÷</button>

            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button class="operator" data-value="*">×</button>

            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button class="operator" data-value="-">−</button>

            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>
            <button class="operator" data-value="+">+</button>

            <button class="utility" data-action="sign">+/−</button>
            <button data-value="0">0</button>
            <button data-action="decimal">.</button>
            <button class="equals" data-action="equals">=</button>

        </section>

        <footer>
            <span class="status-dot"></span>
            Ready to calculate
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
